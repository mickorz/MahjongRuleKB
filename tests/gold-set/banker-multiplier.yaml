# 庄闲倍率与基础结算（HJ-F-BANK、HJ-P-ZIMO、HJ-P-DIANPAO、XS-F-BANK、XS-F-HU）
# 杭州庄闲倍率固定 8；萧山 = 2^牢数，因此必须覆盖二牢、四牢、五牢等差异边界
- id: TC-F-BANK-001
  name: 杭州庄家三牢自摸平胡
  ruleset_id: hangzhou-friends-4p
  rule_refs: [HJ-F-BANK, HJ-P-ZIMO]
  input:
    ruleset_id: hangzhou-friends-4p
    winner_is_banker: true
    win_type: self_draw
    fan_multiplier: 1
    banker_level: 3
    base_score: 1
  expected:
    winner_score: 24
    other_scores: [-8, -8, -8]
  verification:
    status: verified
    by: 人工
    source: 杭州文档 2.3.3「自摸」庄家自摸三个闲家各乘 8
  automation:
    status: automated
    test_ref: tests/regression/gold-set.test.ts

