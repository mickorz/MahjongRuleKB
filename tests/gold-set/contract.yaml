- id: TC-P-CONTRACT-009
  name: 庄家平胡抢杠，加杠闲家同时承担倒承包
  ruleset_id: hangzhou-friends-4p
  rule_refs: [HJ-P-CONTRACT, HJ-P-QIANG]
  input:
    original_payments: { B: 8, C: 8, D: 8 }
    winner: A
    win_type: qiang_gang
    discarder: B
    qiang_gang_r: 24
    contracts: [{ holder: B, provider: A }]
  expected:
    scores: { A: 72, B: -72, C: 0, D: 0 }
    applied: ["原赔付 B 付 24", "反承包叠加 B 付 48"]
  verification:
    status: verified
    by: 人工
    source: 杭州文档 2.3.2.8 例子「庄家平胡抢杠，加杠闲家同时承担倒承包，付 24＋24×2＝72 分」
  automation:
    status: automated
    test_ref: tests/regression/gold-set.test.ts
