# 跟庄成立判定与赔付（XS-R-GZ、XS-F-GZ）
- id: TC-R-GZ-001
  name: 四张同牌面跟庄成立
  ruleset_id: xiaoshan-friends-4p
  rule_refs: [XS-R-GZ]
  input:
    tiles: [二筒, 二筒, 二筒, 二筒]
    joker: 白板
  expected:
    established: true
    payment: { A: -24, B: 8, C: 8, D: 8 }
    dice: [5, 3]
  verification:
    status: verified
    by: 人工
    source: 萧山文档 R-GZ 验收表「都是二筒，第 4 张二筒 → 成立」
  automation:
    status: automated
    test_ref: tests/regression/gold-set.test.ts

- id: TC-R-GZ-002
