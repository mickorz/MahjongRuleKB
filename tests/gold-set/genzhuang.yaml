  expected:
    established: true
  verification:
    status: verified
    by: 人工
    source: 萧山文档 R-GZ 条件「第 4 张牌面相同，或第 4 张是本局实际财神」
  automation:
    status: automated
    test_ref: tests/regression/gold-set.test.ts

